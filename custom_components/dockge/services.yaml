start_stack:
  name: Start Stack
  description: Start a Docker Compose stack
  fields:
    stack_name:
      name: Stack Name
      description: Name of the stack to start
      required: true
      selector:
        text:
    agent:
      name: Agent
      description: Agent name, e.g. "Gastly" (leave empty for primary server)
      default: ""
      selector:
        text:

stop_stack:
  name: Stop Stack
  description: Stop a Docker Compose stack
  fields:
    stack_name:
      name: Stack Name
      description: Name of the stack to stop
      required: true
      selector:
        text:
    agent:
      name: Agent
      description: Agent name, e.g. "Gastly" (leave empty for primary server)
      default: ""
      selector:
        text:

restart_stack:
  name: Restart Stack
  description: Restart a Docker Compose stack
  fields:
    stack_name:
      name: Stack Name
      description: Name of the stack to restart
      required: true
      selector:
        text:
    agent:
      name: Agent
      description: Agent name, e.g. "Gastly" (leave empty for primary server)
      default: ""
      selector:
        text:

system_prune:
  name: System Prune
  description: Run Docker system prune to clean up unused images, containers, and networks.
  fields:
    agent:
      name: Agent
      description: The agent/server to prune. Leave empty for all agents.
      required: false
      example: "Gastly"
      selector:
        text:
